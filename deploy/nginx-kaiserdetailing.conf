# nginx site config for kaiserdetailing.com
# Place at /etc/nginx/sites-available/kaiserdetailing and symlink into sites-enabled.

server {
    listen 80;
    server_name kaiserdetailing.com www.kaiserdetailing.com;

    # Serve static images/favicon directly (faster than going through Flask).
    # Put favicon.png, the Before*/After*.png images, og-image.jpg, etc. in /static.
    location /static/ {
        alias /home/kaiser/kaiser-detail/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After this works on port 80, add HTTPS with:
#   sudo certbot --nginx -d kaiserdetailing.com -d www.kaiserdetailing.com
# Certbot will rewrite this file to listen on 443 and redirect 80 -> 443.