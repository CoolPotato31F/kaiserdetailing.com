<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Kaiser's Detail Co.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--cream:#faf7f2;--charcoal:#18181a;--muted:#6b6860;--rule:#e0d9ce;--gold:#b87414;--gold-h:#9a600e;--gold-bg:#fdf3e0;--gold-bd:#e8c47a;--r:6px;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--cream);font-family:'Outfit',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.box{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:2.5rem;max-width:380px;width:100%;box-shadow:0 4px 24px rgba(0,0,0,0.06);}
.brand{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;color:var(--charcoal);text-align:center;margin-bottom:0.3rem;}
.brand span{color:var(--gold);}
.sub{text-align:center;font-size:0.8rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2rem;}
label{display:block;font-size:0.7rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:0.5rem;}
input{width:100%;padding:12px 14px;background:var(--cream);border:1px solid var(--rule);border-radius:var(--r);font-family:'Outfit',sans-serif;font-size:0.95rem;}
input:focus{outline:none;border-color:var(--gold);}
button{width:100%;margin-top:1.3rem;padding:13px;border:none;border-radius:var(--r);background:var(--gold);color:#fff;font-family:'Outfit',sans-serif;font-weight:600;font-size:0.9rem;cursor:pointer;transition:background 0.18s;}
button:hover{background:var(--gold-h);}
.err{background:#fdeaea;border:1px solid #e8b4b4;color:#a33;padding:10px 14px;border-radius:var(--r);font-size:0.85rem;margin-bottom:1.2rem;text-align:center;}
</style>
</head>
<body>
  <div class="box">
    <div class="brand">Kaiser's <span>Detail Co.</span></div>
    <div class="sub">Admin Panel</div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="POST">
      <label>Password</label>
      <input type="password" name="password" autofocus required>
      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
